name: CodeQL

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: '17 4 * * 2'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: codeql-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze:
    name: Analisar (${{ matrix.language }})
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      actions: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - language: go
            build-mode: manual
          - language: actions
            build-mode: none
    steps:
      - name: Obter código
        uses: actions/checkout@v7

      - name: Preparar Go
        if: matrix.language == 'go'
        uses: actions/setup-go@v7
        with:
          go-version: '1.26'
          check-latest: true
          cache-dependency-path: go.sum

      - name: Inicializar CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.build-mode }}

      - name: Compilar código Go para análise
        if: matrix.language == 'go'
        run: go build ./...

      - name: Publicar análise de segurança
        uses: github/codeql-action/analyze@v4
        with:
          category: /language:${{ matrix.language }}
